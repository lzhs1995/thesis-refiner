name: Offline contracts
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install 'jsonschema>=4,<5'
      - run: python -B -m unittest discover -s tests -v
      # Cross-repository tests require the compatible resource-broker checkout.
      # They are run during combined installation, never replaced by a fake broker.
